<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="Mr3X5rtDGnaX0HFIeMevfV">
<head data-page-node-id="ZxbqGxRpKIVYooHVFJLmEy">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="MCErAfbUxKAjMtnZxMuXBo">
<title>自媒体创作台</title>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<style>
:root{
  --bg:#F1ECDF; --side:#EAE3CD; --side-hi:#E1D9BE;
  --bg:#FFFBEA;          /* 奶淡黄主背景 */
  --side:#FFF3D6;        /* 侧栏稍深 */
  --side-hi:#FFEDC2;
  --card:#FFFFFF; --line:#F0DDB8;
  --text:#3D2914;        /* 深棕文字 */
  --sub:#8B6F47;         /* 浅棕次要文字 */
  --sub2:#B89877;
  --brand:#FFB74D;       /* 奶橙强调 */
  --brand-d:#FFA726;
  --brand-bg:#FFF3D6;    /* 奶黄背景 */
  --blush:#FFCCBC;       /* 腮红橘 */
  --blue:#5B9EE8; --purple:#A47BD9; --green:#7CB342; --red:#E57373; --amber:#FFB300;
  --radius:12px;
  --shadow:0 1px 2px rgba(180,140,40,.06),0 2px 10px rgba(180,140,40,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:70px}
a{color:var(--brand);text-decoration:none}
svg{display:block;flex-shrink:0}
.hidden{display:none!important}

.layout{display:flex;min-height:100vh}

/* 侧栏 */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:210px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;z-index:30}
.sb-head{margin-bottom:18px}
.sb-logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:var(--text)}
.sb-badge{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.sb-sub{font-size:11px;color:var(--sub);margin:6px 0 0 39px;letter-spacing:.04em}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:1px;margin-top:6px;overflow-y:auto;padding-right:2px}
.sb-nav::-webkit-scrollbar{width:0}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;transition:.12s;background:none;text-align:left;width:100%}
.sb-item:hover{background:var(--side-hi)}
.sb-item.on{background:var(--card);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.sb-item svg{color:var(--sub);width:17px;height:17px;flex-shrink:0}
.sb-item.on svg{color:var(--brand)}
.sb-divider{height:1px;background:var(--line);margin:8px 6px}
.sb-group{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--sub2);padding:14px 12px 4px;text-transform:uppercase}
.sb-group:first-child{padding-top:4px}
.sb-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sb-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-stat{background:var(--card);border-radius:9px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)}
.sb-stat b{font-size:18px;font-weight:800;color:var(--brand);display:block;line-height:1.1}
.sb-stat span{font-size:11px;color:var(--sub);display:block;margin-top:2px}
 .today-mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.today-mini:hover{border-color:var(--brand)}
.tm-main{display:flex;align-items:center;gap:10px}
.tm-ring-wrap{position:relative;width:58px;height:58px;flex-shrink:0}
.tm-ring{width:58px;height:58px;transform:rotate(-90deg)}
.tm-ring .ring-bg{fill:none;stroke:var(--bg);stroke-width:6}
.tm-ring .ring-fg{fill:none;stroke:var(--brand);stroke-width:6;stroke-linecap:round;stroke-dasharray:150.8;stroke-dashoffset:150.8;transition:stroke-dashoffset .5s}
.tm-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tm-center b{font-size:17px;font-weight:800;color:var(--text)}
.tm-center span{font-size:9px;color:var(--sub2);margin-top:1px}
.tm-side{min-width:0;flex:1}
.tm-title{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--text);margin-bottom:6px}
.tm-title svg{color:var(--brand);flex-shrink:0}
.tm-rows{display:flex;gap:5px;flex-wrap:wrap}
.tm-row{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--sub);background:var(--bg);border-radius:6px;padding:2px 7px}
.tm-row b{font-size:12px;font-weight:800}
.tm-row.ov b{color:var(--red)}
.tm-row.td b{color:var(--brand)}
.tm-row.todo b{color:var(--blue)}
.tm-row:empty{display:none}
.alert-bar{display:flex;align-items:center;gap:10px;background:linear-gradient(to right,#FDE8E6,#FFF6E9);border:1px solid #F3C6BC;border-radius:10px;padding:9px 14px;margin:10px 0;font-size:13px;color:#A33B2B;font-weight:600}
.alert-bar svg{flex-shrink:0}
.alert-bar .ab-btn{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:#D43A1F;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.alert-bar .ab-x{background:none;border:none;color:#C97B6B;cursor:pointer;font-size:14px;line-height:1;padding:2px}
 .dash{display:flex;flex-direction:column;gap:16px}
.dash-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;transition:transform .12s}
.kpi-card:hover{transform:translateY(-2px);border-color:#F0E3C0}
.kpi-card b{font-size:26px;font-weight:700;display:block;color:var(--text);line-height:1.15}
.kpi-card span{font-size:11px;color:var(--sub2);display:block;margin-top:5px;font-weight:500}
.kpi-card .k-dot{width:8px;height:8px;border-radius:50%;margin:0 auto 8px;display:block}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel.wide{grid-column:span 2}
.panel h4{font-size:12.5px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;color:var(--sub)}
.panel h4 .p-dot{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}
.panel h4 .p-more{margin-left:auto;font-size:11px;color:var(--sub2);font-weight:600;cursor:pointer;background:none;border:none}
.panel h4 .p-more:hover{color:var(--brand)}
.stage-groups{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.stage-group .sg-title{font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sg-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.stage-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.stage-row .s-name{width:38px;color:var(--sub2);flex-shrink:0;text-align:right;font-size:11px}
.stage-row .s-bar{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.stage-row .s-fill{height:100%;border-radius:4px;transition:width .3s}
.stage-row .s-n{width:20px;color:var(--sub2);font-size:11px}
.cal-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative;padding-top:14px;margin-top:8px}
.cal-mini::before{content:"";position:absolute;left:14px;right:14px;top:48px;border-top:1.5px dashed rgba(0,0,0,.08)}
.cal-mini-day{border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;min-height:58px;background:var(--bg);position:relative;z-index:1}
.cal-mini-day.has-item::before{content:"";position:absolute;left:50%;top:-12px;width:8px;height:8px;border-radius:50%;background:var(--brand);transform:translateX(-50%);box-shadow:0 0 0 3px rgba(255,183,77,.18)}
.cal-mini-day.today{border-color:var(--brand);background:var(--brand-bg)}
.cal-mini-day .dow{font-size:10px;color:var(--sub2)}
.cal-mini-day .dnum{font-size:14px;font-weight:700;color:var(--text);margin:2px 0}
.cal-mini-day .d-items{font-size:9.5px;color:var(--text);line-height:1.35}
.cal-mini-day .d-items .c{display:block;background:#E8F1FB;color:#3A6EA5;border-radius:4px;padding:1px 3px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-mini-day .d-items .c.done{background:#E5F3E8;color:#2E7D4F}
.todo-mini-item{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12.5px}
.todo-mini-item .tm-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.todo-mini-item .tm-stage{color:var(--sub2);font-size:11px;background:var(--bg);border-radius:5px;padding:1px 7px;white-space:nowrap}
.ov-list{color:var(--red)}
.acc-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
.acc-row:last-child{margin-bottom:0}
.acc-row .ac-name{width:120px;display:flex;align-items:center;gap:5px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row .ac-bar{flex:1;height:18px;background:var(--bg);border-radius:5px;overflow:hidden;display:flex}
.acc-row .ac-bar i{height:100%;display:block;transition:width .3s;position:relative}
.acc-row .ac-bar i.do{background:linear-gradient(to right,#FFD9A0,#FFB74D)}
.acc-row .ac-bar i.pu{background:linear-gradient(to right,#C8E6C9,#66BB6A)}
.acc-row .ac-bar i.ma{background:linear-gradient(to right,#B3E5FC,#4FC3F7)}
.acc-row .ac-bar i span{position:absolute;right:4px;top:0;font-size:9.5px;line-height:18px;color:rgba(0,0,0,.55);font-weight:700}
.acc-row .ac-tot{width:36px;text-align:right;font-weight:800;color:var(--text);font-size:13px;flex-shrink:0}
.legend-row{display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--sub)}
.legend-row .lg{display:inline-flex;align-items:center;gap:5px}
.legend-row .lg-dot{width:10px;height:10px;border-radius:3px}
.pf-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:12.5px}
.pf-bar-row .pb-name{width:70px;color:var(--sub);display:flex;align-items:center;gap:5px}
.pf-bar-row .pb-bar{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.pf-bar-row .pb-bar i{display:block;height:100%;border-radius:4px}
.pf-bar-row .pb-n{width:44px;color:var(--sub2);font-size:11px;text-align:right}
@media(max-width:900px){.dash-kpis{grid-template-columns:repeat(3,1fr)}.dash-grid{grid-template-columns:1fr}.stage-groups{grid-template-columns:1fr}.acc-grid{grid-template-columns:1fr}}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;align-self:flex-start;box-shadow:var(--shadow)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.offline{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb-tools{display:flex;gap:6px}
.sb-tools button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 4px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:var(--shadow)}
.sb-tools button:hover{border-color:var(--brand);color:var(--brand)}

/* 主区 */
.main{margin-left:210px;flex:1;min-width:0;padding:0 36px 40px;max-width:1100px}
.page-head{padding:30px 0 20px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph-block{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ph-eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--sub);text-transform:uppercase}
.ph-title{font-size:26px;font-weight:800;color:var(--text);letter-spacing:.01em}
.ph-hint{margin-left:auto;font-size:12.5px;color:var(--sub);max-width:320px;text-align:right;line-height:1.55;align-self:flex-end}

/* 账号切换条 */
.account-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.account-bar .ab-label{font-size:12px;font-weight:700;color:var(--sub);margin-right:4px;white-space:nowrap}
.ac-chip{font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--sub);font-weight:600;cursor:pointer;white-space:nowrap}
.ac-chip:hover{border-color:var(--brand);color:var(--brand)}
.ac-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.ac-manage{font-size:12px;color:var(--sub2);cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-left:auto;padding:5px 8px;border-radius:6px}
.ac-manage:hover{color:var(--brand);background:var(--bg)}
.ac-badge{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 8px;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:4px}
.ac-badge svg{flex-shrink:0}
.pf-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pf-dot.gzh{background:#2E9E5B}
.pf-dot.xhs{background:#E5422E}
.pf-dot.oth{background:#B8A78A}
.acc-pf-select{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:#fff;color:var(--text);margin-right:6px}
.ac-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.acc-plat{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:3px 4px;background:#fff;color:var(--text)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;border-radius:9px;padding:9px 14px;min-height:40px;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--brand);color:#fff}
.btn-pri:hover{background:var(--brand-d)}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-line:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:9px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.empty{padding:48px 20px;text-align:center;color:var(--sub2);font-size:14px}
.empty svg{margin:0 auto 10px;color:#d4d4da}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:13px;padding:6px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-weight:500;cursor:pointer}
.chip.on{background:var(--text);border-color:var(--text);color:#fff}

.toolbar-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.toolbar-bar input.grow{flex:1;min-width:180px}
.seg{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;display:inline-flex;gap:2px}
.seg button{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--sub);background:none;cursor:pointer}
.seg button.on{background:var(--text);color:#fff}

/* 灵感卡片 */
.insp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.insp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;transition:.12s}
.insp-card.batch{cursor:pointer}
.insp-card.batch .insp-body,.insp-card.batch .insp-actions,.insp-card.batch .insp-head-actions{opacity:.4;pointer-events:none}
.insp-card.batch.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,183,77,.3)}
.insp-select{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:6px;border:2px solid #d4d4da;background:#fff;z-index:2;display:none;align-items:center;justify-content:center}
.insp-card.batch .insp-select{display:flex}
.insp-select.on{background:var(--brand);border-color:var(--brand)}
.insp-select.on svg{color:#fff}
.insp-head{display:flex;align-items:flex-start;gap:8px}
.insp-title-input{font-size:15.5px;font-weight:700;border:none;background:transparent;padding:4px 0;width:100%;border-radius:6px}
.insp-title-input:focus{background:var(--bg);outline:none;box-shadow:0 0 0 2px rgba(255,183,77,.25)}
.insp-head-actions{display:flex;gap:4px;flex-shrink:0}
.insp-mini-btn{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--sub)}
.insp-mini-btn:hover{color:var(--brand)}
.insp-body textarea{font-size:14px;line-height:1.65;border:1px dashed var(--line);background:var(--bg);border-radius:9px;padding:10px 12px;min-height:92px;width:100%;resize:vertical}
.insp-body textarea:focus{border-color:var(--brand);border-style:solid;background:#fff}
.insp-save-hint{font-size:11px;color:var(--sub2);text-align:right;margin-top:2px}
.insp-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.insp-tag{font-size:11.5px;background:var(--brand-bg);color:var(--brand-d);border-radius:6px;padding:3px 9px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.insp-tag .x{cursor:pointer;opacity:.55;display:inline-flex}
.insp-tag .x:hover{opacity:1}
.insp-add-tag{font-size:11.5px;color:var(--sub2);border:1px dashed var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;background:none}
.insp-add-tag:hover{border-color:var(--brand);color:var(--brand)}
.insp-meta-mini{font-size:11.5px;color:var(--sub2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.batch-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:55;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.batch-bar span{font-size:13.5px;font-weight:700;white-space:nowrap}
.batch-bar button{background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600}
.batch-bar button:hover{background:rgba(255,255,255,.28)}
.batch-bar button.danger{background:var(--red)}
.batch-bar .close-b{background:transparent;padding:7px 6px}
.batch-bar .close-b:hover{background:rgba(255,255,255,.16)}
.insp-top{display:flex;align-items:center;justify-content:space-between}
.insp-pf{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff;letter-spacing:.02em}
.pf-xhs{background:#FF5A3C}
.pf-gzh{background:#1F8B5C}
.pf-dy{background:#161616}
.pf-wb{background:#E6413E}
.pf-bili{background:#00AEEC}
.pf-zh{background:#056DE8}
.insp-heat{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--brand)}
.insp-heat svg{color:var(--brand)}
.insp-title{font-size:15.5px;font-weight:700;color:var(--text);line-height:1.5}
.insp-reason{font-size:13px;color:var(--text);background:linear-gradient(to right,var(--brand-bg) 0%,rgba(255,243,214,.35) 60%,transparent 100%);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:9px 12px;line-height:1.65;flex:1}
.insp-actions{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap}
.insp-actions .btn{flex:1}
.result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}

/* ===== 星星人 IP 元素（8 张用户原图内联） ===== */
.ip,.ip-logo,.ip-stat,.ip-empty,.ip-tag,.ip-btn-icon{display:inline-block;flex-shrink:0;background-color:transparent;background-repeat:no-repeat;background-position:center}
.ip-logo{width:40px;height:40px;border-radius:11px;box-shadow:0 3px 10px rgba(180,140,40,.18);background-size:cover;background-color:#fff}
.ip-stat{width:38px;height:38px;border-radius:50%;box-shadow:0 2px 8px rgba(180,140,40,.15);background-size:cover;background-color:#fff}
.ip-empty{width:170px;height:215px;border-radius:18px;background-size:contain;background-color:#fff;box-shadow:0 4px 14px rgba(180,140,40,.12);margin:0 auto 16px}
.ip-tag{width:22px;height:22px;border-radius:50%;box-shadow:0 1px 3px rgba(180,140,40,.15);margin-left:4px;vertical-align:middle;background-size:cover;background-color:#fff}
.ip-btn-icon{width:34px;height:34px;border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:0 2px 6px rgba(180,140,40,.18);background-size:cover;background-color:#fff}

.result-head .count{font-size:14px;font-weight:600;color:var(--text)}
.result-head .count b{color:var(--brand)}

/* 选题 */
.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.topic-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.topic-head{display:flex;align-items:flex-start;gap:10px}
.topic-title{font-weight:700;font-size:15.5px;flex:1;line-height:1.5}
.topic-meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:3px 9px;white-space:nowrap}
.b-pf{background:var(--brand-bg);color:var(--brand)}
.b-img{background:#EFF4FF;color:var(--blue)}
.b-vid{background:#F3EFFF;color:var(--purple)}
.b-done{background:#E7F6EF;color:var(--green)}
.progress{position:relative;padding:6px 0 2px}
.progress-line{position:absolute;left:16px;right:16px;top:26px;height:3px;background:var(--line);border-radius:2px}
.progress-line .fill{height:100%;background:var(--brand);border-radius:2px;transition:.3s}
.steps{display:flex;justify-content:space-between;position:relative}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;width:56px;cursor:pointer}
.step-dot{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #d4d4da;display:flex;align-items:center;justify-content:center;transition:.2s;position:relative;z-index:1}
.step-dot svg{color:#fff}
.step.done .step-dot{background:var(--brand);border-color:var(--brand)}
.step.cur .step-dot{border-color:var(--brand);box-shadow:0 0 0 4px rgba(212,58,31,.15)}
.step-label{font-size:11px;color:var(--sub2);white-space:nowrap}
.step.cur .step-label{color:var(--brand);font-weight:600}
.topic-actions{display:flex;gap:8px;flex-wrap:wrap}
.topic-actions .btn{flex:1;min-width:88px}
.notes{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 11px;line-height:1.6;max-height:78px;overflow:hidden;cursor:pointer;position:relative}
.notes:after{content:'';position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(transparent,var(--bg))}
.notes:hover{border-color:var(--brand)}
.notes.empty{background:transparent;border:1.5px dashed var(--line);color:var(--sub2);display:flex;align-items:center;justify-content:center;padding:14px;font-size:12.5px}
.notes.empty:hover{border-color:var(--brand);color:var(--brand)}
.topic-title{cursor:pointer}
.topic-title:hover{color:var(--brand)}

/* 素材 */
.mat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.mat-title{font-weight:700;font-size:15px;line-height:1.5;display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.mat-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-mini{font-size:11.5px;background:var(--bg);border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:3px 9px;font-weight:500}
.tag-mini.angle{background:#EFF4FF;color:var(--blue);border-color:#D8E4FF}
.tag-mini.quote{background:#FFF7E6;color:#B45309;border-color:#FDE8C8}
.tag-mini.struct{background:#F3EFFF;color:var(--purple);border-color:#E4D9FF}
.tag-mini.data{background:#E7F6EF;color:var(--green);border-color:#C9ECDA}
.tag-mini.case{background:#FFF1ED;color:var(--brand);border-color:#FFD9CF}
.tag-mini.cover{background:#FDF2F8;color:#DB2777;border-color:#FBCFE8}
.mat-link{font-size:12px;display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:500}
.mat-points{font-size:13px;color:var(--sub);line-height:1.6;background:var(--bg);border-radius:8px;padding:9px 11px}
.mat-points .lbl,.mat-learn .lbl{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:4px;letter-spacing:.02em}
.mat-learn{font-size:13px;color:var(--text);line-height:1.6;background:var(--brand-bg);border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:9px 11px}
.rel-chip{font-size:11.5px;color:var(--green);background:#E7F6EF;border-radius:6px;padding:2px 8px;font-weight:600;white-space:nowrap}
.mat-foot{font-size:12px;color:var(--sub2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* 日历 */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cal-title{font-weight:700;font-size:16px;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:12px;color:var(--sub2);font-weight:600;padding:4px 0}
.cal-day{min-height:88px;background:var(--card);border-radius:9px;padding:6px;border:1px solid transparent;position:relative;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:.12s}
.cal-day:hover{border-color:var(--brand)}
.cal-day.out{opacity:.4}
.cal-day.today{border-color:var(--brand);background:var(--brand-bg)}
.cal-num{font-size:12px;font-weight:600;color:var(--sub)}
.cal-day.today .cal-num{color:var(--brand)}
.cal-tag{font-size:10.5px;line-height:1.3;border-radius:5px;padding:2px 5px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cal-tag.done{background:var(--green)}
.cal-tag.pending{background:var(--blue)}
.cal-tag.writing{background:var(--amber)}
.cal-more{font-size:10px;color:var(--sub2);text-align:center}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--sub)}
.legend-dot{width:10px;height:10px;border-radius:3px}
.cal-wrap{display:grid;grid-template-columns:236px 1fr;gap:16px;align-items:start}
.cal-pool-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:sticky;top:16px}
.cal-pool-panel h4{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--sub)}
.cal-pool-hint{font-size:11.5px;color:var(--sub2);margin-bottom:10px}
.cal-task{display:flex;flex-direction:column;gap:4px;background:var(--brand-bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:grab;font-size:12.5px;box-shadow:var(--shadow);transition:.12s}
.cal-task:hover{border-color:var(--brand)}
.cal-task:active{cursor:grabbing}
.cal-task b{font-size:12.5px;color:var(--text);line-height:1.45;font-weight:600}
.cal-task span{font-size:11px;color:var(--sub)}
.cal-day.dragover{border-color:var(--brand);background:var(--brand-bg);box-shadow:0 0 0 3px rgba(255,183,77,.25)}

/* 复盘 */
.rev-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat-num{font-size:20px;font-weight:800}
.stat-label{font-size:12px;color:var(--sub);margin-top:2px}

function flatProps(props){

function localAddRow(table,props,forceId){
  var f=flatProps(props);f._id=forceId||uid();
  if(table==='todo')normTodoRow(f);
  if(table==='topics')f['类型']=tShow(f['类型']);
  store[table].unshift(f);saveCache();return f;
}
function localApply(table,id,props){
  var f=flatProps(props);
  var row=store[table].find(function(x){return x._id===id});
  if(row){for(var k in f)row[k]=f[k];}
  else {row=Object.assign({_id:id},f);if(table==='todo')normTodoRow(row);store[table].unshift(row);}
  if(table==='topics')row['类型']=tShow(row['类型']);
  saveCache();return row;
}
function localDelRow(table,id){
  store[table]=store[table].filter(function(x){return x._id!==id});saveCache();
}
/* 本地优先：localStorage 为权威存储，云端仅尽力同步，避免“保存了却刷新后丢失” */
function dbAdd(table,props){
  var row=localAddRow(table,props);
  var db=getDB();
  if(!db){queuePush({op:'add',table:table,props:props,lid:row._id});return Promise.resolve(row)}
  setSync('syncing');
  var req;
  try{
    if(table==='topics')req=db.addRecord({databaseId:'aLTCALpkBjd6Q9WgnCM0yq',properties:props});
    else if(table==='materials')req=db.addRecord({databaseId:'9Ndg3N4wphS7UC5rSx68Zj',properties:props});
    else if(table==='inspirations')req=db.addRecord({databaseId:'ajmDe7Y4LE44UDbDuy8ye2',properties:props});
    else if(table==='todo')req=db.addRecord({databaseId:'v29GJOoPZ6PIEDSZcwJl1c',properties:props});
    else req=db.addRecord({databaseId:'0tB15w12ZQFB890e95jQJ0',properties:props});
  }catch(e){queuePush({op:'add',table:table,props:props,lid:row._id});return Promise.resolve(row)}
  if(!req||typeof req.then!=='function'){queuePush({op:'add',table:table,props:props,lid:row._id});return Promise.resolve(row)}
  return req.then(function(res){
    var id=resId(res);
    if(id){var r=store[table].find(function(x){return x._id===row._id});if(r){r._id=id;if(table==='todo')r.id=id;saveCache()}}
    queueRemoveAdd(row._id);
    setSync('online');clearFormCache();return row;
  }).catch(function(err){setSync('offline');online=false;queuePush({op:'add',table:table,props:props,lid:row._id});return Promise.resolve(row)});
}
function dbUpd(table,id,props,skipRender){
  localApply(table,id,props);
  if(!skipRender){try{renderAll()}catch(e){console.error(e)}}
  var db=getDB();
  if(db){
    setSync('syncing');
    var req;
    try{
      if(table==='topics')req=db.updateRecord({databaseId:'aLTCALpkBjd6Q9WgnCM0yq',recordId:id,properties:props});
      else if(table==='materials')req=db.updateRecord({databaseId:'9Ndg3N4wphS7UC5rSx68Zj',recordId:id,properties:props});
      else if(table==='inspirations')req=db.updateRecord({databaseId:'ajmDe7Y4LE44UDbDuy8ye2',recordId:id,properties:props});
      else if(table==='todo')req=db.updateRecord({databaseId:'v29GJOoPZ6PIEDSZcwJl1c',recordId:id,properties:props});
      else req=db.updateRecord({databaseId:'0tB15w12ZQFB890e95jQJ0',recordId:id,properties:props});
    }catch(e){queuePush({op:'upd',table:table,id:id,props:props});return Promise.resolve(store[table].find(function(x){return x._id===id}))}
    if(!req||typeof req.then!=='function'){queuePush({op:'upd',table:table,id:id,props:props});return Promise.resolve(store[table].find(function(x){return x._id===id}))}
    return req.then(function(){setSync('online');return store[table].find(function(x){return x._id===id})})
      .catch(function(err){setSync('offline');online=false;queuePush({op:'upd',table:table,id:id,props:props});return Promise.resolve(store[table].find(function(x){return x._id===id}))});
  }
  queuePush({op:'upd',table:table,id:id,props:props});
  return Promise.resolve(store[table].find(function(x){return x._id===id}));
}

function applyQueue(){
  try{
    var q=JSON.parse(localStorage.getItem(LS_PREFIX+'queue')||'[]');
    var changed=false;
    q.forEach(function(op){
      if(!op||!op.table)return;
      if(op.op==='add'){
        if(!op.t||(Date.now()-(op.t||0))>7*86400000){queueRemoveAdd(op.lid);changed=true;return}
        if(storeHasEquivalent(op.table,op.props)){queueRemoveAdd(op.lid);changed=true;return}
        if(!store[op.table].some(function(x){return x._id===op.lid})) localAddRow(op.table,op.props,op.lid);
      }
      else if(op.op==='upd'){ localApply(op.table,op.id,op.props); }
      else if(op.op==='del'){ localDelRow(op.table,op.id); }
    });
    if(changed)saveCache();
  }catch(e){console.error(e)}
}

function syncQueue(){
  var db=getDB();if(!db)return;
  var q;try{q=JSON.parse(localStorage.getItem(LS_PREFIX+'queue')||'[]')}catch(e){return}
  if(!q.length)return;
  var i=0;
  function step(){
    if(i>=q.length)return;
    var op=q[i];
    var req;try{req=cloudReq(db,op)}catch(e){ i++; step(); return; }
    if(!req||typeof req.then!=='function'){ i++; step(); return; }
    req.then(function(){
      q.splice(i,1);
      try{localStorage.setItem(LS_PREFIX+'queue',JSON.stringify(q))}catch(e){}
      step();
    }).catch(function(){ i++; step(); });
  }
  step();
}
function queuePush(op){try{op.t=Date.now();var q=JSON.parse(localStorage.getItem(LS_PREFIX+'queue')||'[]');q.push(op);localStorage.setItem(LS_PREFIX+'queue',JSON.stringify(q))}catch(e){}}

function todoDone(id){
  var td=store.todo.find(function(x){return x.id===id||x._id===id});
  if(!td)return;
  dbUpd('todo',id,{'完成':{checkbox:true},'完成时间':{date:todayStr()}});
  td.done=true;td['完成']=true;td['完成时间']=todayStr();saveCache();
  var tp=store.topics.find(function(x){return x._id===td.topicId});
  var msg='已完成，已移入已办';
  if(tp&&td.stage){
    var steps=stagesOf(tp);
    var doneIdx=steps.indexOf(td.stage);
    if(doneIdx>=0){
      var cur=stName(tp['阶段']||(tp['类型']==='视频'?'灵感':'初稿'));
      var curIdx=steps.indexOf(cur);
      if(curIdx<=doneIdx){
        var nextIdx=doneIdx+1;
        if(nextIdx<steps.length){
          var next=steps[nextIdx];
          dbUpd('topics',tp._id,{'阶段':{select:OPT.stage[sStore(next)]}});
          msg='已完成！阶段自动推进到「'+next+'」';
        }else msg='已完成！这个选题所有阶段都做完了';
      }
    }
  }
  renderToday();if(ui.tab==='todo')renderTodoList();toast(msg);
}

  });

function stagesOf(tp){return tp['类型']==='视频'?STAGE_VID:STAGE_IMG}

      '<button style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--sub)" onclick="delTopic(\''+tp._id+'\')" title="删除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>'+
    '</div>'+

    '</div>'+
    '<div class="progress"><div class="progress-line"><div class="fill" style="width:'+pct+'%"></div></div><div class="steps">'+stepsHtml+'</div></div>'+
    (tp['备注']?'<div class="notes" title="点击编辑初稿" onclick="openEditor(\''+tp._id+'\')">'+esc(tp['备注'])+'</div>':'<div class="notes empty" title="点击写初稿" onclick="openEditor(\''+tp._id+'\')"><span>✏️ 还没有初稿内容，点这里开始写</span></div>')+
    '<div class="topic-actions">'+

function saveRange(){var eb=$('#edBody');if(!eb)return;var sel=window.getSelection();if(sel&&sel.rangeCount){var an=sel.anchorNode;if(an&&eb.contains(an))savedRange=sel.getRangeAt(0).cloneRange();}}
function restoreRange(){if(!savedRange)return;var sel=window.getSelection();try{sel.removeAllRanges();sel.addRange(savedRange);}catch(e){}}
function isRichHtml(s){return /<(b|i|u|strong|em|span|div|p|h1|h2|h3|h4|ul|ol|li|blockquote|font|a|br|img|hr|pre|code)[ >\n]/.test(s||'');}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function sanitizeHtml(html){
  var div=document.createElement('div');div.innerHTML=html||'';
  div.querySelectorAll('script,style,iframe,object,embed,link,meta,base').forEach(function(n){n.remove()});
  div.querySelectorAll('*').forEach(function(n){
    [].slice.call(n.attributes).forEach(function(a){
      var v=(a.value||'').toString().toLowerCase();
      if(a.name.indexOf('on')===0||v.indexOf('javascript:')>=0||(v.indexOf('data:')===0&&a.name!=='src'))n.removeAttribute(a.name);
    });
  });
  return div.innerHTML;
}
function setEdBody(content){
  var eb=$('#edBody');if(!eb)return;
  if(content&&isRichHtml(content))eb.innerHTML=sanitizeHtml(content);
  else if(content)eb.innerHTML=escapeHtml(content).replace(/\n/g,'<br>');
  else eb.innerHTML='';
}
function richExec(cmd,val){
  var eb=$('#edBody');if(!eb)return;eb.focus();restoreRange();
  try{document.execCommand('styleWithCSS',false,true);}catch(e){}
  try{document.execCommand(cmd,false,val==null?null:val);}catch(e){}
  editorInput();
}
function richBlock(val){
  if(!val)return;var eb=$('#edBody');if(!eb)return;eb.focus();restoreRange();

function applyBlockStyle(prop,val){
  var eb=$('#edBody');if(!eb)return;eb.focus();restoreRange();
  var sel=window.getSelection();if(!sel.rangeCount){toast('请先把光标放在正文里',true);return;}
  var node=sel.anchorNode;if(node&&node.nodeType===3)node=node.parentNode;
  if(!node||!eb.contains(node)){toast('请先把光标放在正文里',true);return;}
  while(node&&node.parentNode&&node.parentNode!==eb)node=node.parentNode;
  if(node&&node!==eb)node.style[prop]=val;else if(node===eb)eb.style[prop]=val;
  editorInput();
}
function fmtPaintToggle(){
  var b=$('#btnFmtPaint');

  var node=sel.anchorNode;if(node&&node.nodeType===3)node=node.parentNode;

function applyOneClickFormat(key){
  var p=FORMAT_PRESETS[key];if(!p)return;
  var eb=$('#edBody');if(!eb)return;
  var sel='h1,h2,h3,p,div,blockquote,ul,ol,img';
  var nodes=eb.querySelectorAll(sel);
  if(!nodes.length && eb.innerHTML.trim()){eb.innerHTML='<p>'+eb.innerHTML+'</p>';nodes=eb.querySelectorAll(sel);}
  if(!nodes.length){closeFormatPresets();toast('正文还是空的，先写点内容吧',true);return;}
  Array.prototype.forEach.call(nodes,function(el){
    var tag=el.tagName;
    var st=p[tag]||p.P;if(!st)return;
    for(var prop in st){if(Object.prototype.hasOwnProperty.call(st,prop))el.style[prop]=st[prop];}
    if(tag==='UL'||tag==='OL'){Array.prototype.forEach.call(el.querySelectorAll('li'),function(li){li.style.fontFamily=st.fontFamily;li.style.fontSize=st.fontSize;li.style.lineHeight=st.lineHeight;li.style.color=st.color;});}
  });
  closeFormatPresets();editorInput();toast('已套用「'+p.name+'」排版');
}

function mdRender(txt){
  var lines=txt.split(/\r?\n/);
  var out='';var para=[];var list=null;
  function flush(){
    if(list){out+='<ul>'+list+'</ul>';list=null}
    if(para.length){out+='<p>'+para.map(esc).join('<br>')+'</p>';para=[]}
  }
  lines.forEach(function(ln){
    var s=ln.trim();
    if(!s){flush();return}
    if(/^##?\s+/.test(s)){flush();out+='<h3>'+esc(s.replace(/^##?\s+/,''))+'</h3>';return}
    if(/^[-*]\s+/.test(s)||/^\d+[.、]\s+/.test(s)){if(!list)list='';list+='<li>'+esc(s.replace(/^([-*]|\d+[.、])\s+/,''))+'</li>';return}
    if(list)flush();
    para.push(ln);
  });
  flush();
  return out.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}

  var grid=$('#calGrid');if(!grid)return;

  var startDow=(first.getDay()+6)%7;var dim=new Date(y,m+1,0).getDate();

function chartBar(rows){
  var top=rows.slice().sort(function(a,b){return (Number(b['点赞'])||0)-(Number(a['点赞'])||0)}).slice(0,6);
  var max=Math.max.apply(null,top.map(function(r){return Number(r['点赞'])||0}));if(max<=0)max=1;
  var w=560,h=170,pad=34,bw=Math.min(44,(w-pad*2)/top.length*0.55);
  var svg='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="min-width:420px">';
  svg+='<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(h-pad)+'" stroke="#E4E4E9" stroke-width="1"/>';
  svg+='<line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-8)+'" y2="'+(h-pad)+'" stroke="#E4E4E9" stroke-width="1"/>';
  top.forEach(function(r,i){
    var bh=Math.max(8,(Number(r['点赞'])||0)/max*(h-pad-20));
    var x=pad+i*(w-pad*2)/top.length+( (w-pad*2)/top.length-bw)/2;
    var y=h-pad-bh;
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw+'" height="'+bh.toFixed(1)+'" rx="4" fill="'+(i===0?'#D43A1F':'#FFB4A1')+'"/>';
    svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" fill="#6B6354" font-weight="700">'+(Number(r['点赞'])||0)+'</text>';
    var label=String(r['笔记标题']||'?').slice(0,5);
    svg+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-pad+14)+'" text-anchor="middle" font-size="10" fill="#9A917F">'+esc(label)+'</text>';
  });
  svg+='</svg>';
  return '<div class="chart-box"><div style="font-size:12px;color:var(--sub);margin-bottom:8px;font-weight:600">点赞 Top 对比</div>'+svg+'</div>';
}

function analyzeText(t){
  var hooks=['扎心','后悔','真相','偷偷','不为人知','避坑','踩坑','反常识','逆袭','普通人','底层逻辑','别再','警惕','注意'];
  var found=hooks.filter(function(h){return t.indexOf(h)>-1});
  var hook;
  if(found.length)hook='标题/开头命中了情绪词「'+found.slice(0,3).join('、')+'」，负责制造「这说的是我」的代入感。勾人写法：把痛点场景直接前置，比如「如果你也'+found[0]+'，先看完这条」。';
  else if(/\d+/.test(t))hook='标题/开头带有具体数字，数字提高具体感和可信度。勾人写法：把最大卖点量化，改成「N 个…」「第 N 个…」结构，人群+数字+结果。';
  else hook='内容偏陈述型，缺抓眼球的钩子。建议把最反直觉的一句话提到最前面：先说结论，再解释为什么。';
  var struct;
  if(/开头|首先|第一步|第一/.test(t))struct='正文有明显分步/序号结构，是「清单式」爆款的标准骨架：痛点引入（1-2 句）→ 分点干货（3-5 点）→ 结尾给一个行动指令。';
  else struct='正文偏段落式叙述。建议拆成：开头 3 行内亮出核心观点 → 中段每个小标题一个案例/数据 → 结尾总结成一句可截图的话。短平快是平台算法偏好的节奏。';
  var comments='这类笔记评论区高频出现的提问通常是三类：求清单/模板（「求一份」「蹲一个」）、问操作细节（「具体怎么做的」）、表达共鸣（「我也是」「太真实了」）。建议在正文里主动预埋答案，结尾设计一个开放提问（「你踩过哪个坑？」），把互动引向评论区。';
  var formula='【拆解结论】'+((found.length?'情绪词钩子 + ':'数字量化 + ')+(/第一|分点|步骤/.test(t)?'清单式结构':'分点式结构'))+' + 结尾提问互动';
  return {hook:hook,struct:struct,comments:comments,formula:formula};
}

function genTitles(topic){
  var t=topic.trim();
  var short=t.length>14?t.slice(0,12)+'…':t;
  var cands=[
    {t:t+'，大多数人都做错了','why':'「做错了」制造纠错心理，点开率通常不错','f':0},
    {t:'为什么'+short+'？这是我在第 100 次复盘后想明白的','why':'疑问句 + 亲身复盘背书，兼具悬念与信任感','f':1},
    {t:'普通人也能学会的'+short+'：一个方法就够了','why':'「普通人」「一个方法」降低门槛，适合泛流量','f':0},
    {t:'关于'+short+'，这 3 个真相越早知道越好','why':'数字 + 真相词，清单感强，容易引发收藏','f':1},
    {t:'如果你也在为'+short+'发愁，先看完这篇','why':'第二人称直击场景，代入感强，互动率高','f':1}
  ];
  return cands.map(function(c){
    var score=3;
    if(t.length<=18)score+=0.5;
    if(t.length>4)score+=1;
    score+=c.f;
    if(c.t.indexOf('为什么')>-1||c.t.indexOf('真相')>-1)score+=0.5;
    if(c.t.indexOf('3')>-1||c.t.indexOf('一个方法')>-1)score+=0.5;
    score=Math.min(5,score);
    return {title:c.t,why:c.why,score:score};
  }).sort(function(a,b){return b.score-a.score});
}

/* ===== 收纳筐：本地存储，预留云端升级 ===== */
/* 存储层已隔离在 basketAll/basketAdd/basketRemove 三个函数里。
   日后在 WorkBuddy 页面新建「收纳筐」数据表后，把它的 databaseId 填到 BASKET_DB_ID，
   即可把这三个函数改为读写云端，实现多设备同步（数据可一并迁移）。 */
var BASKET_DB_ID='';
var BK_SRC={topic:'来自选题',mat:'来自素材',todo:'来自待办'};
function basketAll(){if(!Array.isArray(store.basket))store.basket=[];return store.basket}
function bkToProps(s){
  var p={};
  for(var k in s){
    var v=s[k];
    if(v==null||v==='')continue;
    if(k==='类型'){p[k]={select:(v==='视频')?'tp_vid':'tp_img'};continue}
    if(k==='阶段'){p[k]={select:OPT.stage[sStore(v)]||v};continue}
    if(k==='状态'){p[k]={select:OPT.inspSt[v]||v};continue}
    if(k==='完成'){p[k]={checkbox:!!v};continue}
    if(k==='评分'){p[k]={number:Number(v)||0};continue}
    if(k==='分类'){p[k]={multi_select:Array.isArray(v)?v:[v]};continue}
    if(k==='来源链接'){p[k]={url:{text:(v&&v.text)||'查看原文',link:(v&&v.link)||''}};continue}
    if(/时间|日期/.test(k)){p[k]={date:fmtDate(v)||String(v)};continue}
    if(typeof v==='object'){p[k]=toProp(k,v);continue}
    p[k]={text:String(v)};
  }
  return p;
}
function basketAdd(src,row,title,summary){
  var snap={};

  basketAll().unshift({_id:uid(),src:src,title:title||'未命名',summary:summary||'',acc:row['账号']||'',note:'',savedAt:todayStr(),snap:snap});

      (alt?'<button class="btn btn-line btn-sm" onclick="basketNewTopic(\''+r._id+'\')">'+alt+'</button>':'')+
      '<button class="btn btn-ghost btn-sm" onclick="basketNote(\''+r._id+'\')">'+(r.note?'改想法':'写想法')+'</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="basketDel(\''+r._id+'\')">删除</button>'+
    '</div></div>';
}
function renderBasket(){
  var box=document.getElementById('bkList');if(!box)return;
  var kw=(ui.bkW||'').trim().toLowerCase();
  var rows=basketAll().filter(function(r){
    if(ui.bkFilter!=='all'&&r.src!==ui.bkFilter)return false;
    if(kw){
      var hay=(String(r.title||'')+String(r.summary||'')+String(r.note||'')).toLowerCase();
      if(hay.indexOf(kw)<0)return false;
    }
    return true;
  });
  if(!rows.length){box.innerHTML='<div class="empty"><div>收纳筐是空的。在选题池、素材库或待办里点「收纳」，把暂时用不上、又舍不得删的东西收进来。</div></div>';return}
  box.innerHTML='<div class="bk-grid">'+rows.map(bkCard).join('')+'</div>';
}
function exportJSON(){
  var data={exportedAt:new Date().toISOString(),topics:store.topics,materials:store.materials,inspirations:store.inspirations,reviews:store.reviews,todo:store.todo,basket:store.basket};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='自媒体工作台备份-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  toast('备份已导出');
}
function importJSON(input){
  var f=input.files[0];if(!f)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var d=JSON.parse(e.target.result);var n=0;
      if(d.topics&&d.topics.length){d.topics.forEach(function(r){var p={};for(var k in r){if(k==='_id'||k==='id')continue;p[k]=toProp(k,r[k])}dbAdd('topics',p);n++})}
      if(d.materials&&d.materials.length){d.materials.forEach(function(r){var p={};for(var k in r){if(k==='_id'||k==='id')continue;p[k]=toProp(k,r[k])}dbAdd('materials',p);n++})}
      if(d.inspirations&&d.inspirations.length){d.inspirations.forEach(function(r){var p={};for(var k in r){if(k==='_id'||k==='id')continue;p[k]=toProp(k,r[k])}dbAdd('inspirations',p);n++})}
      if(d.reviews&&d.reviews.length){d.reviews.forEach(function(r){var p={};for(var k in r){if(k==='_id'||k==='id')continue;p[k]=toProp(k,r[k])}dbAdd('reviews',p);n++})}
      if(d.todo&&d.todo.length){d.todo.forEach(function(r){var p={};for(var k in r){if(k==='_id'||k==='id')continue;p[k]=toProp(k,r[k])}dbAdd('todo',p);n++})}
      if(d.basket&&d.basket.length){store.basket=(store.basket||[]).concat(d.basket);saveCache();n+=d.basket.length}
      toast('导入 '+n+' 条数据');
    }catch(err){toast('备份文件解析失败',true)}
    input.value='';
  };
  reader.readAsText(f);
}
function toProp(k,v){
  if(v==null)return null;
  if(typeof v==='object'){
    if(v.text!==undefined&&Object.keys(v).length===1)return {text:v.text};
    if(v.link!==undefined||v.text&&v.link)return {url:{text:v.text||'查看原文',link:v.link}};
    if(v.images)return {image:v};
    if(v.select!==undefined)return {select:v.select};
    if(v.multi_select!==undefined)return {multi_select:v.multi_select};
    if(v.number!==undefined)return {number:v.number};
    if(v.checkbox!==undefined)return {checkbox:v.checkbox};
    if(v.date!==undefined)return {date:v.date};
    return v;
  }
  return {text:typeof v==='string'?v:String(v)};
}
